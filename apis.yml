apis:
  - aid: openstreetmap:main-api
    name: OpenStreetMap Main Editing API v0.6
    description: >-
      The OpenStreetMap main API v0.6 provides CRUD operations for map data editing including nodes, ways, relations,
      changesets, and notes. Requires OAuth 2.0 authentication for write operations. Maximum bounding box query area is
      0.25 square degrees. Returns XML or JSON. Intended for editing, not high-volume read access.
    humanURL: https://wiki.openstreetmap.org/wiki/API_v0.6
    baseURL: https://api.openstreetmap.org/api/0.6
    tags:
      - Geospatial
      - Mapping
      - Open Data
      - REST
      - Editing
    properties:
      - type: Documentation
        url: https://wiki.openstreetmap.org/wiki/API_v0.6
      - type: RateLimits
        url: https://operations.osmfoundation.org/policies/api/
      - type: OpenAPI
        url: >-
          https://raw.githubusercontent.com/api-evangelist/openstreetmap/refs/heads/main/openapi/openstreetmap-main-openapi.yml
      - type: JSONSchema
        url: >-
