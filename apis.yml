aid: openstreetmap
name: OpenStreetMap
description: >-
  OpenStreetMap (OSM) is a collaborative project to create a free, editable map of the world. The OSM ecosystem exposes
  a family of public REST APIs: the main editing API (v0.6) for CRUD operations on map data, the Overpass API for
  complex read-only geospatial queries, and the Nominatim API for forward and reverse geocoding. Map data is licensed
  under the Open Database License (ODbL) 1.0 and tile imagery under CC BY-SA 2.0.
type: Index
position: Consumer
access: 3rd-Party
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
  - Geospatial
  - Mapping
  - Open Data
  - Geocoding
  - Editing
created: '2026-03-18'
modified: '2026-05-19'
