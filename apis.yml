  - aid: openstreetmap:overpass-api
    name: OpenStreetMap Overpass API
    description: >-
      The Overpass API is a read-only database engine for complex geospatial queries against the OSM dataset. Accepts
      Overpass QL or XML queries and returns results in XML, JSON, GeoJSON, or CSV. Safe usage: under 10,000 queries/day
      and under 1 GB/day. Python SDKs include overpass, overpy, and OSMPythonTools; JavaScript SDKs include
      query-overpass and overpass-ts.
    humanURL: https://wiki.openstreetmap.org/wiki/Overpass_API
    baseURL: https://overpass-api.de/api
    tags:
      - Geospatial
      - Mapping
      - Open Data
      - XML
      - Overpass
    properties:
      - type: Documentation
        url: https://wiki.openstreetmap.org/wiki/Overpass_API
      - type: Reference
        url: https://dev.overpass-api.de/overpass-doc/en/
      - type: DeveloperTools
        url: https://overpass-turbo.eu/
  - aid: openstreetmap:nominatim-api
    name: OpenStreetMap Nominatim Geocoding API
    description: >-
      Nominatim is the OpenStreetMap geocoding API providing search (forward geocoding), reverse geocoding, and address
      lookup for OSM objects. Rate limit is 1 request/second for the public instance. Requires valid User-Agent header.
      Open source under GNU GPL v3; self-hosted deployment available for higher volume needs.
    humanURL: https://nominatim.org/release-docs/latest/api/Overview/
    baseURL: https://nominatim.openstreetmap.org
    tags:
      - Geospatial
