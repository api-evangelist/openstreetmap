apis:
- aid: openstreetmap:openstreetmap-main-api
  name: OpenStreetMap Main Editing API v0.6
  tags:
  - Geospatial
  - Mapping
  - Open Data
  - REST
  - Editing
  image: https://raw.githubusercontent.com/api-evangelist/openstreetmap/refs/heads/main/image.png
  humanURL: https://wiki.openstreetmap.org/wiki/API_v0.6
  baseURL: https://api.openstreetmap.org/api/0.6
  properties:
  - url: https://wiki.openstreetmap.org/wiki/API_v0.6
    type: Documentation
  - url: https://operations.osmfoundation.org/policies/api/
    type: RateLimits
  - url: https://raw.githubusercontent.com/api-evangelist/openstreetmap/refs/heads/main/openapi/openstreetmap-main-openapi.yml
    type: OpenAPI
  - url: https://raw.githubusercontent.com/api-evangelist/openstreetmap/refs/heads/main/json-schema/openstreetmap-node-schema.json
    type: JSONSchema
  - url: https://raw.githubusercontent.com/api-evangelist/openstreetmap/refs/heads/main/json-ld/openstreetmap-context.jsonld
    type: JSONLDContext
  description: >-
    The OpenStreetMap main API v0.6 provides CRUD operations for map data editing including nodes, ways, relations, changesets, and notes. Requires OAuth 2.0 authentication for write operations. Maximum bounding box query area is 0.25 square degrees. Returns XML or JSON. Intended for editing, not high-volume read access.
- aid: openstreetmap:openstreetmap-overpass-api
  name: OpenStreetMap Overpass API
  tags:
  - Geospatial
  - Mapping
  - Open Data
  - XML
  - Overpass
  image: https://raw.githubusercontent.com/api-evangelist/openstreetmap/refs/heads/main/image.png
  humanURL: https://wiki.openstreetmap.org/wiki/Overpass_API
  baseURL: https://overpass-api.de/api/interpreter
  properties:
  - url: https://wiki.openstreetmap.org/wiki/Overpass_API
    type: Documentation
  - url: https://dev.overpass-api.de/overpass-doc/en/
    type: Reference
  - url: https://overpass-turbo.eu/
    type: DeveloperTools
  description: >-
    The Overpass API is a read-only database engine for complex geospatial queries against the OSM dataset. Accepts Overpass QL or XML queries and returns results in XML, JSON, GeoJSON, or CSV. Safe usage: under 10,000 queries/day and under 1 GB/day. Python SDKs include overpass, overpy, and OSMPythonTools; JavaScript SDKs include query-overpass and overpass-ts.
- aid: openstreetmap:openstreetmap-nominatim-api
  name: OpenStreetMap Nominatim Geocoding API
  tags:
  - Geospatial
  - Mapping
  - Geocoding
  - Open Data
  image: https://raw.githubusercontent.com/api-evangelist/openstreetmap/refs/heads/main/image.png
  humanURL: https://nominatim.org/release-docs/latest/api/Overview/
  baseURL: https://nominatim.openstreetmap.org
  properties:
  - url: https://nominatim.org/release-docs/latest/api/Overview/
    type: Documentation
  - url: https://operations.osmfoundation.org/policies/nominatim/
    type: RateLimits
  - url: https://raw.githubusercontent.com/api-evangelist/openstreetmap/refs/heads/main/openapi/openstreetmap-nominatim-openapi.yml
    type: OpenAPI
  description: >-
    Nominatim is the OpenStreetMap geocoding API providing search (forward geocoding), reverse geocoding, and address lookup for OSM objects. Rate limit is 1 request/second for the public instance. Requires valid User-Agent header. Open source under GNU GPL v3; self-hosted deployment available for higher volume needs.
- aid: openstreetmap:openstreetmap-api
  name: OpenStreetMap Overpass API
  tags:
  - Geospatial
  - Mapping
  - Open Data
  - XML
  - Overpass
  image: https://raw.githubusercontent.com/api-evangelist/openstreetmap/refs/heads/main/image.png
  humanURL: https://wiki.openstreetmap.org/wiki/Overpass_API
  baseURL: https://overpass-api.de/api
  properties:
  - url: https://wiki.openstreetmap.org/wiki/Overpass_API
    type: Documentation
  description: >-
    OpenStreetMap provides the Overpass API for complex geospatial queries against the OSM database. The API accepts Overpass QL queries and returns XML or JSON results for building footprints, road networks, POIs, and administrative boundaries.
