naftiko: 1.0.0-alpha2
info:
  label: OpenStreetMap API v0.6 — Users
  description: 'OpenStreetMap API v0.6 — Users. 1 operations. Lead operation: Get authenticated user details. Self-contained
    Naftiko capability covering one Openstreetmap business surface.'
  tags:
  - Openstreetmap
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPENSTREETMAP_API_KEY: OPENSTREETMAP_API_KEY
capability:
  consumes:
  - type: http
    namespace: main-users
    baseUri: https://api.openstreetmap.org/api/0.6
    description: OpenStreetMap API v0.6 — Users business capability. Self-contained, no shared references.
    resources:
    - name: user-details
      path: /user/details
      operations:
      - name: getuserdetails
        method: GET
        description: Get authenticated user details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.OPENSTREETMAP_API_KEY}}'
  exposes:
  - type: rest
    namespace: main-users-rest
    port: 8080
    description: REST adapter for OpenStreetMap API v0.6 — Users. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/user/details
      name: user-details
      description: REST surface for user-details.
      operations:
      - method: GET
        name: getuserdetails
        description: Get authenticated user details
        call: main-users.getuserdetails
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: main-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for OpenStreetMap API v0.6 — Users. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-authenticated-user-details
      description: Get authenticated user details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: main-users.getuserdetails
      outputParameters:
      - type: object
        mapping: $.
