naftiko: 1.0.0-alpha2
info:
  label: OpenStreetMap API v0.6
  description: The OpenStreetMap main API v0.6 provides CRUD operations for map data editing including nodes, ways, relations,
    changesets, and notes. Requires OAuth 2.0 authentication for write operations. Maximum bounding box query area is 0.25
    square degrees. Returns XML or JSON. Intended for editing, not high-volume read access.
  tags:
  - Openstreetmap
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: openstreetmap
    baseUri: https://api.openstreetmap.org/api/0.6
    description: OpenStreetMap API v0.6 HTTP API.
    authentication:
      type: bearer
      token: '{{OPENSTREETMAP_TOKEN}}'
    resources:
    - name: map
      path: /map
      operations:
      - name: getmapdata
        method: GET
        description: Get map data for a bounding box
        inputParameters:
        - name: bbox
          in: query
          type: string
          required: true
          description: Bounding box as min_lon,min_lat,max_lon,max_lat (e.g., -0.489,51.28,0.236,51.686)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: node-id
      path: /node/{id}
      operations:
      - name: getnode
        method: GET
        description: Get node by ID
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatenode
        method: PUT
        description: Update a node
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletenode
        method: DELETE
        description: Delete a node
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: node-create
      path: /node/create
      operations:
      - name: createnode
        method: PUT
        description: Create a new node
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: node-id-version
      path: /node/{id}/{version}
      operations:
      - name: getnodeversion
        method: GET
        description: Get a specific version of a node
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
        - name: version
          in: path
          type: integer
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: way-id
      path: /way/{id}
      operations:
      - name: getway
        method: GET
        description: Get way by ID
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: relation-id
      path: /relation/{id}
      operations:
      - name: getrelation
        method: GET
        description: Get relation by ID
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: changeset-create
      path: /changeset/create
      operations:
      - name: createchangeset
        method: PUT
        description: Create a changeset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: changeset-id
      path: /changeset/{id}
      operations:
      - name: getchangeset
        method: GET
        description: Get changeset details
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
        - name: include_discussion
          in: query
          type: boolean
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatechangeset
        method: PUT
        description: Update changeset tags
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: changeset-id-close
      path: /changeset/{id}/close
      operations:
      - name: closechangeset
        method: PUT
        description: Close a changeset
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: changeset-id-upload
      path: /changeset/{id}/upload
      operations:
      - name: uploadchangeset
        method: POST
        description: Upload an OsmChange document
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: notes
      path: /notes
      operations:
      - name: searchnotes
        method: GET
        description: Search notes
        inputParameters:
        - name: bbox
          in: query
          type: string
          description: Bounding box (min_lon,min_lat,max_lon,max_lat)
        - name: q
          in: query
          type: string
          description: Free text search
        - name: status
          in: query
          type: string
        - name: limit
          in: query
          type: integer
        - name: closed
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createnote
        method: POST
        description: Create a note
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: notes-id
      path: /notes/{id}
      operations:
      - name: getnote
        method: GET
        description: Get a note
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: user-details
      path: /user/details
      operations:
      - name: getuserdetails
        method: GET
        description: Get authenticated user details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: capabilities
      path: /capabilities
      operations:
      - name: getcapabilities
        method: GET
        description: Get API capabilities and limits
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
